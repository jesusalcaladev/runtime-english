    /**
     * =========================================================================
     * 2. MOTOR TTS BLINDADO CON FALLBACK ACÚSTICO WEB AUDIO API
     * =========================================================================
     */
    class ResilientTTSEngine {
        constructor() {
            this.synth = window.speechSynthesis || null;
            this.voices = [];
            this.enVoice = null;
            this.rate = 1.0;
            this.audioCtx = null;
            this.ttsWorking = false;

            this.loadVoices();
            this.initSpeechRecognition();
        }

        loadVoices() {
            if (!this.synth) {
                this.updateBadge("WebAudio", "Fallback acústico activo");
                return;
            }

            const fetchList = () => {
                const rawVoices = this.synth.getVoices() || [];
                if (rawVoices.length > 0) {
                    this.voices = rawVoices;
                    // Buscar estrictamente voces en inglés
                    this.enVoice =
                        rawVoices.find(v => v.lang === 'en-US' && /Google|Natural|Microsoft|Samantha|Daniel|Alex/i.test(v.name)) ||
                        rawVoices.find(v => v.lang === 'en-US') ||
                        rawVoices.find(v => v.lang === 'en-GB') ||
                        rawVoices.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) ||
                        null;

                    this.ttsWorking = true;
                    const label = this.enVoice ? `${this.enVoice.name} (${this.enVoice.lang})` : `Sistema (${rawVoices[0].lang})`;
                    this.updateBadge("TTS En-US", label);
                } else {
                    this.updateBadge("TTS Listo", "Haz clic en Probar voz");
                }
            };

            fetchList();
            if (typeof this.synth.onvoiceschanged !== 'undefined') {
                this.synth.onvoiceschanged = fetchList;
            }
            // Polling de respaldo durante los primeros 3 segundos
            [250, 750, 1500, 3000].forEach(ms => setTimeout(fetchList, ms));
        }

        updateBadge(badgeText, infoText) {
            const b = document.getElementById('tts-mode-badge');
            const i = document.getElementById('tts-voice-info');
            if (b) b.textContent = badgeText;
            if (i) i.textContent = infoText;
        }

        unlockAudio(manualToast = false) {
            this.loadVoices();
            if (!this.audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) this.audioCtx = new AudioContext();
            }
            if (this.audioCtx && this.audioCtx.state === 'suspended') {
                this.audioCtx.resume();
            }
            if (manualToast) {
                app.showToast(`Motor de audio sincronizado (${this.voices.length} voces detectadas).`, "success");
            }
        }

        // Fallback acústico silábico limpio usando Web Audio API si el navegador bloquea speechSynthesis
        playAcousticFallback(text) {
            try {
                this.unlockAudio(false);
                if (!this.audioCtx) return;
                const words = text.split(/\s+/).slice(0, 10);
                const now = this.audioCtx.currentTime;

                words.forEach((word, idx) => {
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    const start = now + idx * (0.16 / this.rate);
                    const dur = 0.11 / this.rate;

                    // Modulación suave por longitud de palabra para simular entonación
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(240 + (word.length % 5) * 28, start);
                    osc.frequency.exponentialRampToValueAtTime(190, start + dur);

                    gain.gain.setValueAtTime(0.001, start);
                    gain.gain.linearRampToValueAtTime(0.08, start + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, start + dur);

                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.start(start);
                    osc.stop(start + dur + 0.01);
                });
            } catch (e) {
                console.warn("Audio fallback error:", e);
            }
        }

        speak(rawText, btnEl = null) {
            const clean = String(rawText || '')
                .replace(/\/\/.*/g, '')
                .replace(/[{}()[\]<>]/g, ' ')
                .replace(/\//g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

            if (!clean) return;
            this.unlockAudio(false);

            // Resetear estado visual de botones previos
            document.querySelectorAll('[data-tts-active="true"]').forEach(b => {
                b.dataset.ttsActive = "false";
                b.classList.remove('ring-1', 'ring-brand-emerald', 'text-brand-emerald');
            });

            if (btnEl) {
                btnEl.dataset.ttsActive = "true";
                btnEl.classList.add('ring-1', 'ring-brand-emerald', 'text-brand-emerald');
            }

            if (!this.synth) {
                this.playAcousticFallback(clean);
                setTimeout(() => {
                    if (btnEl) {
                        btnEl.dataset.ttsActive = "false";
                        btnEl.classList.remove('ring-1', 'ring-brand-emerald', 'text-brand-emerald');
                    }
                }, 800);
                return;
            }

            try {
                this.synth.cancel();
                if (this.voices.length === 0) {
                    this.loadVoices();
                }

                const utter = new SpeechSynthesisUtterance(clean);
                utter.lang = 'en-US';
                utter.rate = this.rate;
                utter.pitch = 1.0;
                utter.volume = 1.0;

                if (this.enVoice) {
                    utter.voice = this.enVoice;
                }

                let started = false;
                utter.onstart = () => {
                    started = true;
                    this.ttsWorking = true;
                };

                utter.onend = () => {
                    if (btnEl) {
                        btnEl.dataset.ttsActive = "false";
                        btnEl.classList.remove('ring-1', 'ring-brand-emerald', 'text-brand-emerald');
                    }
                };

                utter.onerror = () => {
                    if (btnEl) {
                        btnEl.dataset.ttsActive = "false";
                        btnEl.classList.remove('ring-1', 'ring-brand-emerald', 'text-brand-emerald');
                    }
                    this.playAcousticFallback(clean);
                };

                this.synth.resume();
                this.synth.speak(utter);

                // Si en 450ms el navegador sandbox no arrancó speechSynthesis, activar fallback acústico
                setTimeout(() => {
                    if (!started && !this.synth.speaking) {
                        this.playAcousticFallback(clean);
                        if (btnEl) {
                            btnEl.dataset.ttsActive = "false";
                            btnEl.classList.remove('ring-1', 'ring-brand-emerald', 'text-brand-emerald');
                        }
                    }
                }, 450);
            } catch (err) {
                this.playAcousticFallback(clean);
            }
        }

        initSpeechRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return;
            this.recognition = new SR();
            this.recognition.lang = 'en-US';
            this.recognition.interimResults = true;
            this.recognition.maxAlternatives = 1;
        }

        checkMic(onProgress, onFail) {
            if (!this.recognition) {
                onFail("El reconocimiento por micrófono requiere Chrome, Edge o Safari reciente.");
                return;
            }
            let finalStr = '';
            this.recognition.onresult = (ev) => {
                let interim = '';
                for (let i = ev.resultIndex; i < ev.results.length; i++) {
                    if (ev.results[i].isFinal) finalStr += ev.results[i][0].transcript;
                    else interim += ev.results[i][0].transcript;
                }
                onProgress(finalStr || interim, Boolean(finalStr));
            };
            this.recognition.onerror = (e) => {
                onFail(e.error === 'not-allowed' ? "Permiso de micrófono bloqueado por el navegador." : "No se captó voz clara. Intenta de nuevo.");
            };
            try {
                this.recognition.start();
            } catch (e) {
                onFail("El micrófono ya está escuchando.");
            }
        }
    }

                            desc: "En documentación y código, casi siempre hablas de 'it' (the server, the function, the API, the script). Por eso el verbo añade -S: 'The function has...', 'The error says...', 'The code goes...', 'This library needs...'."
                        },

                        items: [

            this.currentView = 'dashboard';

            this.currentLessonIdx = 0;

            this.commitDesc = 'add JWT refresh token endpoint';
            this.standupYesterday = 'finished the login API integration';
            this.standupToday = 'writing unit tests for user authentication';
            this.standupBlocker = 'none';

            this.initLogos();
            this.initTheme();
            this.bindEvents();
            this.renderSidebar();
            this.updateTopMetrics();
            this.navigate('dashboard');
        }

        loadState() {
            const defaults = {
                devName: "Developer Name",
                darkMode: false,
                completedExercises: {},
                completedLessons: {},
                checkedWeeks: [],
                certId: `DEV-${Math.random().toString(36).substring(2, 6).toUpperCase()}-${new Date().getFullYear()}`
            };
            try {
                const raw = localStorage.getItem('deveng_core_v1');
                return raw ? { ...defaults, ...JSON.parse(raw) } : defaults;
            } catch (e) {
                return defaults;
            }
        }

        saveState() {
            try {
                localStorage.setItem('deveng_core_v1', JSON.stringify(this.state));
                this.updateTopMetrics();
                this.renderSidebar();
            } catch (e) {
                console.error(e);
            }
        }

        initLogos() {
            const slot = document.getElementById('brand-logo-slot');
            if (slot) slot.innerHTML = SVG_LOGOS.main;
        }

        initTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (this.state.darkMode) {
                html.classList.add('dark');
                if (icon) icon.setAttribute('data-lucide', 'sun');
            } else {
                html.classList.remove('dark');
                if (icon) icon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        }

        bindEvents() {
            document.getElementById('theme-toggle').addEventListener('click', () => {
                this.state.darkMode = !this.state.darkMode;
                this.saveState();
                this.initTheme();
            });
            document.getElementById('mobile-menu-btn').addEventListener('click', () => this.toggleSidebar());
        }

        setSpeechRate(rate) {
            this.voice.rate = rate;
            const sBtn = document.getElementById('speed-slow-btn');
            const nBtn = document.getElementById('speed-norm-btn');
            if (rate < 1.0) {
                sBtn.className = "px-2 py-1 rounded-md font-mono font-medium transition bg-surface-0 dark:bg-darksurface-2 text-brand-ink dark:text-white";
                nBtn.className = "px-2 py-1 rounded-md font-mono font-medium transition text-brand-muted dark:text-gray-400";
            } else {
                nBtn.className = "px-2 py-1 rounded-md font-mono font-medium transition bg-surface-0 dark:bg-darksurface-2 text-brand-ink dark:text-white";
                sBtn.className = "px-2 py-1 rounded-md font-mono font-medium transition text-brand-muted dark:text-gray-400";
            }
            this.showToast(`Velocidad TTS: ${rate}x`, 'info');
        }

        testVoice() {
            this.voice.speak("The server is running. Pull the latest changes before you push your commit.");
        }

        speakBtn(text, label = "") {
            const safe = text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            return `
                <button type="button" onclick="event.stopPropagation(); app.voice.speak('${safe}', this)" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-surface-1 dark:bg-darksurface-2 hover:bg-surface-2 dark:hover:bg-darksurface-3 text-brand-ink dark:text-gray-200 text-xs font-medium transition hairline shrink-0" title="Pronunciar en inglés">
                    <i data-lucide="volume-2" class="w-3.5 h-3.5 text-brand-emerald"></i>
                    ${label ? `<span>${label}</span>` : ''}
                </button>
            `;
        }

        triggerConfetti(mode = 'normal') {
            if (typeof confetti !== 'function') return;
            confetti({
                particleCount: mode === 'lesson' ? 95 : 45,
                spread: mode === 'lesson' ? 75 : 55,
                origin: { y: 0.68 },
                colors: ['#10A37F', '#111827', '#34D399', '#6EE7B7']
            });
        }

        showToast(msg, type = 'info') {
            const c = document.getElementById('toast-container');
            const el = document.createElement('div');
            const ic = type === 'success' ? 'check-circle-2' : type === 'error' ? 'alert-circle' : 'terminal';
            const col = type === 'success' ? 'text-brand-emerald' : type === 'error' ? 'text-rose-500' : 'text-brand-ink dark:text-gray-200';
            el.className = "bg-surface-0 dark:bg-darksurface-1 text-brand-ink dark:text-gray-100 px-4 py-3 rounded-xl hairline text-xs font-medium flex items-center gap-2.5 transition-all duration-200 translate-y-2 opacity-0 pointer-events-auto";
            el.innerHTML = `<i data-lucide="${ic}" class="w-4 h-4 ${col} shrink-0"></i><span>${msg}</span>`;
            c.appendChild(el);
            lucide.createIcons();
            requestAnimationFrame(() => el.classList.remove('translate-y-2', 'opacity-0'));
            setTimeout(() => {
                el.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => el.remove(), 250);
            }, 3000);
        }

        toggleSidebar(force) {
            const sb = document.getElementById('sidebar');
            const bd = document.getElementById('sidebar-backdrop');
            const open = !sb.classList.contains('-translate-x-full');
            const next = typeof force === 'boolean' ? force : !open;
            sb.classList.toggle('-translate-x-full', !next);
            bd.classList.toggle('hidden', !next);
        }

        getProgressStats() {
            let totalEx = 0;
            let a1Done = 0, a1Total = 0;
            let b1Done = 0, b1Total = 0;

            DEV_CURRICULUM.modules.forEach(m => {
                m.lessons.forEach(l => {
                    l.exercises.forEach(ex => {
                        totalEx++;
                        const done = Boolean(this.state.completedExercises[ex.id]);
                        if (m.level === 'A1-A2') {
                            a1Total++;
                            if (done) a1Done++;
                        } else {
                            b1Total++;
                            if (done) b1Done++;
                        }
                    });
                });
            });

            const doneEx = Object.keys(this.state.completedExercises).length;
            const pct = totalEx === 0 ? 0 : Math.min(100, Math.round((doneEx / totalEx) * 100));
            const a1Pct = a1Total === 0 ? 0 : Math.round((a1Done / a1Total) * 100);
            const b1Pct = b1Total === 0 ? 0 : Math.round((b1Done / b1Total) * 100);
            const currentCefr = a1Pct === 100 && b1Pct >= 50 ? 'B1-B2' : a1Pct >= 50 ? 'A2 → B1' : 'A1-A2';

            return { totalEx, doneEx, pct, a1Pct, b1Pct, currentCefr };
        }

        updateTopMetrics() {
            const stats = this.getProgressStats();
            document.getElementById('global-progress-text').textContent = `${stats.pct}%`;
            document.getElementById('cefr-level-pill').textContent = stats.currentCefr;
        }

        renderSidebar() {
            const renderList = (levelFilter) => DEV_CURRICULUM.modules
                .filter(m => m.level === levelFilter)
                .map(m => {
                    const doneL = m.lessons.filter(l => this.state.completedLessons[l.id]).length;
                    const complete = doneL === m.lessons.length;
                    return `
                        <button onclick="app.openModule('${m.id}', 0)" data-nav="mod-${m.id}" class="nav-item w-full flex items-center justify-between px-2.5 py-2 rounded-lg text-sm transition text-left">
                            <div class="flex items-center gap-2 truncate">
                                <span class="w-4 h-4 rounded flex items-center justify-center text-[10px] font-mono font-bold shrink-0 ${complete ? 'bg-brand-emerald text-white' : 'bg-surface-2 dark:bg-darksurface-2 text-brand-muted'}">
                                    ${complete ? '<i data-lucide="check" class="w-2.5 h-2.5"></i>' : m.id.replace('m', '')}
                                </span>
                                <span class="truncate">${m.shortTitle}</span>
                            </div>
                            <span class="text-[11px] font-mono text-brand-subtle ml-1">${doneL}/${m.lessons.length}</span>
                        </button>
                    `;
                }).join('');

            document.getElementById('nav-a1a2').innerHTML = renderList('A1-A2');
            document.getElementById('nav-b1b2').innerHTML = renderList('B1-B2');
            lucide.createIcons();
        }

        setActiveNav(key) {
            document.querySelectorAll('.nav-item').forEach(btn => {
                const active = btn.dataset.nav === key;
                btn.classList.toggle('bg-surface-2', active);
                btn.classList.toggle('dark:bg-darksurface-2', active);
                btn.classList.toggle('font-medium', active);
                btn.classList.toggle('text-brand-ink', active);
                btn.classList.toggle('dark:text-white', active);
                btn.classList.toggle('text-brand-muted', !active);
                btn.classList.toggle('dark:text-gray-400', !active);
            });
        }

        navigate(view) {
            this.currentView = view;
            this.toggleSidebar(false);
            window.scrollTo({ top: 0, behavior: 'smooth' });
            this.setActiveNav(view);

            if (view === 'dashboard') this.renderDashboard();
            else if (view === 'tools') this.renderToolsLab();
            else if (view === 'youtube') this.renderYoutube50();
            else if (view === 'checklist') this.renderChecklist();
            else if (view === 'certificate') this.renderCertificate();

            lucide.createIcons();
        }

        openModule(modId, lessonIdx = 0) {
            this.currentView = 'module';
            this.currentModId = modId;
            this.currentLessonIdx = lessonIdx;
            this.pronunciationResult = null;
            this.toggleSidebar(false);
            this.setActiveNav(`mod-${modId}`);

            const mod = DEV_CURRICULUM.modules.find(m => m.id === modId);
            const lesson = mod.lessons[lessonIdx];
            lesson.exercises.forEach(ex => {
                if (ex.type === 'builder' && !this.builderState[ex.id]) {
                    this.builderState[ex.id] = {
                        selected: [],
                        pool: [...ex.words].sort(() => Math.random() - 0.5)
                    };
                }
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
            this.renderLesson();
            lucide.createIcons();
        }

            main.innerHTML = `
                <div class="max-w-3xl mx-auto space-y-8 pb-16">

                                <span>Volver al Roadmap</span>
                            </button>
                            <span class="font-mono">${mod.level} · ${lesson.step}</span>
                        </div>

                        <div class="flex gap-2">
                            ${mod.lessons.map((l, idx) => {
                                const curr = idx === this.currentLessonIdx;
                                const done = Boolean(this.state.completedLessons[l.id]);
                                return `<button onclick="app.openModule('${mod.id}', ${idx})" class="flex-1 h-1.5 rounded-full transition ${curr ? 'bg-brand-ink dark:bg-white' : done ? 'bg-brand-emerald' : 'bg-surface-2 dark:bg-darksurface-2'}"></button>`;
                            }).join('')}
                        </div>

                        <div class="pt-1 space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="font-mono text-xs font-semibold text-brand-emerald">${lesson.step}</span>
                                ${allDone ? `<span class="inline-flex items-center gap-1 text-xs font-medium text-brand-emerald"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Completada</span>` : ''}
                            </div>
                            <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight">${lesson.title}</h1>
                            <p class="text-sm text-brand-muted dark:text-gray-400">${lesson.summary}</p>
                        </div>
                    </div>

                    <!-- Técnica Cognitiva -->
                    <div class="p-4 sm:p-5 rounded-2xl bg-surface-1 dark:bg-darksurface-1 hairline space-y-1.5">

                            <span>PATRÓN COGNITIVO: ${lesson.technique.name.toUpperCase()}</span>

                    <!-- Contenido Técnico de la Lección -->
                    <div>${this.renderLessonBody(lesson)}</div>

                    <!-- Laboratorio de Voz y Micrófono -->
                    <div class="p-5 rounded-2xl bg-surface-1 dark:bg-darksurface-1 hairline space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-mono font-semibold uppercase text-brand-muted flex items-center gap-1.5">
                                <i data-lucide="mic" class="w-3.5 h-3.5 text-brand-emerald"></i>
                                Práctica Oral & Shadowing
                            </span>
                            ${this.speakBtn(lesson.pronunciation, "Escuchar frase")}
                        </div>
                        <p class="font-mono text-xs sm:text-sm font-medium">"${lesson.pronunciation}"</p>
                        <div class="flex flex-wrap items-center gap-3">
                            <button id="mic-btn" onclick="app.runPronunciationCheck('${lesson.pronunciation.replace(/'/g, "\\'")}')" class="px-4 py-2 rounded-xl bg-surface-0 dark:bg-darksurface-2 hover:bg-surface-2 text-xs font-medium hairline inline-flex items-center gap-2 transition">
                                <i data-lucide="mic" class="w-3.5 h-3.5 text-rose-500"></i>
                                <span id="mic-label">Validar mi pronunciación</span>

                        </div>
                        <div id="mic-feedback" class="${this.pronunciationResult ? '' : 'hidden'} p-3 rounded-xl bg-surface-0 dark:bg-darksurface-2 hairline text-xs">
                            ${this.pronunciationResult || ''}

                    </div>

                    <!-- Ejercicios con Mastery Lock -->
                    <div class="space-y-4">

        renderLessonBody(lesson) {

                return `

                            ${lesson.items.map(it => `

                                            <span class="text-xs text-brand-muted">— ${it.ctx}</span>
                                        </div>

                                </div>

            if (lesson.viewType === 'tech_verbs_20') {
                return `
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        ${lesson.items.map(it => `

                                <div>
                                    <div class="flex items-center gap-2">

                `;

            if (lesson.viewType === 'dev_tenses') {
                return `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                        ${lesson.tenses.map(t => `
                            <div class="p-4 rounded-2xl bg-surface-1 dark:bg-darksurface-1 hairline space-y-3">
                                <div>
                                    <div class="text-xs font-mono font-semibold text-brand-emerald">${t.tag}</div>
                                    <h3 class="text-base font-semibold">${t.name}</h3>
                                </div>
                                <div class="p-2.5 rounded-xl bg-surface-0 dark:bg-darksurface-2 hairline font-mono text-xs font-semibold flex items-center justify-between gap-2">

                                    ${this.speakBtn(t.formula)}
                                </div>
                                <div class="space-y-1.5">
                                    ${t.cases.map(c => `
                                        <div class="flex items-center justify-between gap-2 text-xs p-2 rounded-lg bg-surface-0 dark:bg-darksurface-2 hairline">
                                            <span class="font-mono text-[11px]">${c}</span>
                                            ${this.speakBtn(c)}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            if (lesson.viewType === 'git_and_errors') {
                return `
                    <div class="space-y-4">
                        <div class="p-4 rounded-2xl bg-surface-1 dark:bg-darksurface-1 hairline space-y-2.5">
                            <div class="text-xs font-mono font-semibold text-brand-emerald">COMANDOS Y FLUJO GIT / GITHUB</div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                ${lesson.gitTerms.map(g => `
                                    <div class="p-2.5 rounded-xl bg-surface-0 dark:bg-darksurface-2 hairline flex items-center justify-between gap-2 text-xs">
                                        <div>
                                            <span class="font-mono font-bold text-brand-emerald">${g.term}</span> <span class="text-brand-muted">(${g.desc})</span>
                                            <div class="font-mono text-[11px] mt-0.5">${g.ex}</div>
                                        </div>
                                        ${this.speakBtn(g.ex)}
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="rounded-2xl bg-surface-1 dark:bg-darksurface-1 hairline overflow-hidden">
                            <div class="px-4 py-3 hairline-b text-xs font-mono font-semibold text-rose-500">MENSAJES DE ERROR EN CONSOLA</div>
                            <div class="divide-y divide-black/5 dark:divide-white/5">
                                ${lesson.consoleErrors.map(e => `
                                    <div class="p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                                        <div>
                                            <div class="font-mono font-semibold text-rose-600 dark:text-rose-400">${e.err} <span class="font-sans font-normal text-brand-muted">— ${e.meaning}</span></div>
                                            <div class="text-brand-muted dark:text-gray-300 mt-0.5">Solución: ${e.fix}</div>
                                        </div>
                                        ${this.speakBtn(e.err)}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            if (lesson.viewType === 'concepts_and_phrasal') {
                return `
                    <div class="space-y-4">
                        <div class="p-4 rounded-2xl bg-surface-1 dark:bg-darksurface-1 hairline space-y-2">
                            <div class="text-xs font-mono font-semibold text-brand-emerald">ARQUITECTURA Y FRAMEWORKS</div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                ${lesson.concepts.map(c => `
                                    <div class="p-2.5 rounded-xl bg-surface-0 dark:bg-darksurface-2 hairline flex items-center justify-between gap-2 text-xs">
                                        <div>
                                            <div class="font-mono font-semibold">${c.t}</div>
                                            <div class="text-[11px] text-brand-muted">${c.d}</div>
                                        </div>
                                        ${this.speakBtn(c.t)}
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="p-4 rounded-2xl bg-surface-1 dark:bg-darksurface-1 hairline space-y-2">
                            <div class="text-xs font-mono font-semibold text-brand-emerald">14 PHRASAL VERBS ESENCIALES PARA DEV</div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                ${lesson.phrasalVerbs.map(p => `
                                    <div class="p-2.5 rounded-xl bg-surface-0 dark:bg-darksurface-2 hairline flex items-center justify-between gap-2 text-xs">
                                        <div>
                                            <span class="font-mono font-bold text-brand-emerald">${p.pv}</span> <span class="text-brand-muted">(${p.es})</span>
                                            <div class="font-mono text-[11px] mt-0.5">${p.ex}</div>
                                        </div>
                                        ${this.speakBtn(p.ex)}
                                    </div>
                                `).join('')}
                            </div>

                `;

            if (lesson.viewType === 'standup_guide') {

                        ${lesson.phrases.map(p => `
                            <div class="p-3.5 flex items-center justify-between gap-3 text-xs sm:text-sm">

                                    <div class="text-[11px] font-mono text-brand-emerald font-semibold">${p.sit}</div>
                                    <div class="font-mono text-xs mt-0.5">${p.en}</div>

                `;

            if (lesson.viewType === 'commits_prs') {
                return `
                    <div class="space-y-4">
                        <div class="rounded-2xl bg-surface-1 dark:bg-darksurface-1 hairline overflow-hidden">
                            <div class="px-4 py-3 hairline-b text-xs font-mono font-semibold text-brand-emerald">CONVENTIONAL COMMITS</div>
                            <div class="divide-y divide-black/5 dark:divide-white/5">
                                ${lesson.commitTypes.map(c => `
                                    <div class="p-3 flex items-center justify-between gap-2 text-xs">
                                        <div>
                                            <span class="font-mono font-bold text-brand-emerald">${c.type}</span> <span class="text-brand-muted">(${c.use})</span>
                                            <div class="font-mono mt-0.5">${c.ex}</div>
                                        </div>
                                        ${this.speakBtn(c.ex)}
                                    </div>
                                `).join('')}

                        </div>

                        <div class="p-4 rounded-2xl bg-surface-1 dark:bg-darksurface-1 hairline space-y-2">

                            ${lesson.soTemplate.map(s => `
                                <div class="p-2.5 rounded-xl bg-surface-0 dark:bg-darksurface-2 hairline flex items-center justify-between gap-2 text-xs">
                                    <div>
                                        <div class="font-semibold">${s.label}</div>
                                        <div class="font-mono text-[11px] text-brand-muted mt-0.5">${s.en}</div>
                                    </div>
                                    ${this.speakBtn(s.en)}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            return '';
        }

        renderExercise(ex, idx, all) {
            const locked = Boolean(this.state.completedExercises[ex.id]);
            const fb = this.exerciseFeedback[ex.id];
            const nextEx = all[idx + 1];

            let body = '';
            if (ex.type === 'choice') {
                body = `
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        ${ex.options.map((opt, oIdx) => {
                            let cls = "bg-surface-0 dark:bg-darksurface-2 hover:bg-surface-2 dark:hover:bg-darksurface-3";
                            if (locked) {
                                cls = oIdx === ex.answer
                                    ? "bg-emerald-50 dark:bg-emerald-950/50 text-emerald-900 dark:text-emerald-200 font-semibold ring-1 ring-brand-emerald"
                                    : "bg-surface-0 dark:bg-darksurface-2 opacity-40";
                            }
                            return `
                                <button onclick="app.answerChoice('${ex.id}', ${oIdx})" ${locked ? 'disabled' : ''} class="p-3 rounded-xl hairline text-left text-xs font-mono transition flex items-center justify-between gap-2 ${cls} ${locked ? 'cursor-not-allowed' : ''}">
                                    <span>${opt}</span>
                                    ${locked && oIdx === ex.answer ? `<i data-lucide="check-circle-2" class="w-4 h-4 text-brand-emerald shrink-0"></i>` : ''}
                                </button>
                            `;
                        }).join('')}
                    </div>
                `;
            } else if (ex.type === 'builder') {
                const b = this.builderState[ex.id] || { selected: locked ? ex.words : [], pool: [] };
                const words = locked ? ex.words : b.selected;
                body = `
                    <div class="space-y-3">
                        <div class="min-h-[46px] p-2.5 rounded-xl bg-surface-0 dark:bg-darksurface-2 hairline flex flex-wrap gap-1.5 items-center">
                            ${words.length === 0 ? `<span class="text-xs text-brand-subtle">Ordena los bloques en inglés...</span>` : ''}
                            ${words.map((w, i) => `
                                <button onclick="app.pickWord('${ex.id}', 'unpick', ${i})" ${locked ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg ${locked ? 'bg-brand-emerald text-white' : 'bg-brand-ink dark:bg-white text-white dark:text-brand-ink'} font-mono text-xs font-medium ${locked ? 'cursor-not-allowed' : ''}">
                                    ${w}
                                </button>
                            `).join('')}
                        </div>
                        ${!locked ? `
                            <div class="flex flex-wrap gap-1.5">
                                ${b.pool.map((w, i) => `
                                    <button onclick="app.pickWord('${ex.id}', 'pick', ${i})" class="px-3 py-1.5 rounded-lg bg-surface-0 dark:bg-darksurface-2 hover:bg-surface-2 hairline font-mono text-xs transition">${w}</button>
                                `).join('')}
                            </div>
                            <div class="flex gap-2">
                                <button onclick="app.checkBuilder('${ex.id}')" class="px-4 py-2 rounded-xl bg-brand-ink dark:bg-white text-white dark:text-brand-ink text-xs font-medium hover:opacity-90 transition">Verificar</button>
                                <button onclick="app.resetBuilder('${ex.id}')" class="px-3 py-2 rounded-xl bg-surface-0 dark:bg-darksurface-2 hairline text-xs text-brand-muted">Reiniciar</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            return `
                <div id="ex-box-${ex.id}" class="p-5 rounded-2xl bg-surface-1 dark:bg-darksurface-1 hairline space-y-3">
                    <div class="flex items-center justify-between text-xs font-mono text-brand-muted">
                        <span>TEST ${idx + 1}/${all.length}</span>
                        ${locked
                            ? `<span class="inline-flex items-center gap-1 text-brand-emerald font-semibold"><i data-lucide="lock" class="w-3 h-3"></i> DOMINADO</span>`
                            : `<span>PENDIENTE</span>`
                        }
                    </div>
                    <p class="text-sm font-medium">${ex.prompt}</p>
                    ${body}
                    ${(fb || locked) ? `
                        <div class="p-3.5 rounded-xl ${(fb && !fb.ok && !locked) ? 'bg-rose-50 dark:bg-rose-950/40 text-rose-900 dark:text-rose-200' : 'bg-emerald-50/80 dark:bg-emerald-950/40 text-emerald-950 dark:text-emerald-100'} hairline text-xs space-y-2">
                            <div class="flex items-center justify-between">
                                <span class="font-semibold flex items-center gap-1.5">
                                    <i data-lucide="${(fb && !fb.ok && !locked) ? 'alert-circle' : 'check-circle-2'}" class="w-4 h-4 ${(fb && !fb.ok && !locked) ? 'text-rose-500' : 'text-brand-emerald'}"></i>
                                    ${(fb && !fb.ok && !locked) ? 'Revisa la regla e intenta otra vez' : 'Correcto — Ejercicio completado'}
                                </span>
                                ${locked ? this.speakBtn(ex.words ? ex.words.join(' ') : ex.options[ex.answer], "Oír") : ''}
                            </div>
                            <p class="opacity-90 leading-relaxed">${ex.explanation}</p>
                            ${locked && nextEx ? `
                                <button onclick="document.getElementById('ex-box-${nextEx.id}').scrollIntoView({behavior:'smooth', block:'center'})" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-brand-emerald text-white font-medium text-xs hover:bg-brand-emeraldHover transition">
                                    <span>Siguiente ejercicio</span>
                                    <i data-lucide="arrow-down" class="w-3.5 h-3.5"></i>
                                </button>
                            ` : ''}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        renderLessonNextBanner(mod) {
            const modIdx = DEV_CURRICULUM.modules.findIndex(m => m.id === mod.id);
            const hasNextLesson = this.currentLessonIdx + 1 < mod.lessons.length;
            const hasNextMod = modIdx + 1 < DEV_CURRICULUM.modules.length;

            let btn = '';
            if (hasNextLesson) {
                btn = `<button onclick="app.openModule('${mod.id}', ${this.currentLessonIdx + 1})" class="px-5 py-2.5 rounded-xl bg-brand-emerald hover:bg-brand-emeraldHover text-white text-xs sm:text-sm font-medium inline-flex items-center gap-2 shrink-0"><span>Siguiente lección</span><i data-lucide="arrow-right" class="w-4 h-4"></i></button>`;
            } else if (hasNextMod) {
                const nextM = DEV_CURRICULUM.modules[modIdx + 1];
                btn = `<button onclick="app.openModule('${nextM.id}', 0)" class="px-5 py-2.5 rounded-xl bg-brand-emerald hover:bg-brand-emeraldHover text-white text-xs sm:text-sm font-medium inline-flex items-center gap-2 shrink-0"><span>Ir a ${nextM.code} (${nextM.level})</span><i data-lucide="arrow-right" class="w-4 h-4"></i></button>`;
            } else {

        findEx(exId) {
            for (const m of DEV_CURRICULUM.modules) {
                for (const l of m.lessons) {
                    const f = l.exercises.find(e => e.id === exId);
                    if (f) return f;
                }
            }
            return null;
        }

        markExDone(exId, audioPhrase) {
            this.state.completedExercises[exId] = true;
            this.exerciseFeedback[exId] = { ok: true };
            this.saveState();
            this.triggerConfetti('normal');
            if (audioPhrase) this.voice.speak(audioPhrase);
            this.renderLesson();
            lucide.createIcons();
        }

        answerChoice(exId, idx) {
            if (this.state.completedExercises[exId]) return;
            const ex = this.findEx(exId);
            if (idx === ex.answer) {
                this.markExDone(exId, ex.options[ex.answer]);
            } else {
                this.exerciseFeedback[exId] = { ok: false };
                this.renderLesson();
                lucide.createIcons();
            }
        }

        pickWord(exId, dir, idx) {
            if (this.state.completedExercises[exId]) return;
            const b = this.builderState[exId];
            if (dir === 'pick') b.selected.push(b.pool.splice(idx, 1)[0]);
            else b.pool.push(b.selected.splice(idx, 1)[0]);
            delete this.exerciseFeedback[exId];
            this.renderLesson();
            lucide.createIcons();
        }

        resetBuilder(exId) {
            const ex = this.findEx(exId);
            this.builderState[exId] = { selected: [], pool: [...ex.words].sort(() => Math.random() - 0.5) };
            delete this.exerciseFeedback[exId];
            this.renderLesson();
            lucide.createIcons();
        }

        checkBuilder(exId) {
            if (this.state.completedExercises[exId]) return;
            const ex = this.findEx(exId);
            const b = this.builderState[exId];
            if (b.selected.join(' ') === ex.words.join(' ')) {
                this.markExDone(exId, ex.words.join(' '));
            } else {
                this.exerciseFeedback[exId] = { ok: false };
                this.renderLesson();
                lucide.createIcons();
            }
        }

        runPronunciationCheck(target) {
            const btn = document.getElementById('mic-btn');
            const lbl = document.getElementById('mic-label');
            const box = document.getElementById('mic-feedback');
            if (btn) btn.classList.add('mic-recording');
            if (lbl) lbl.textContent = "Escuchando inglés...";

            this.voice.checkMic(
                (transcript, isFinal) => {
                    if (box) {
                        box.classList.remove('hidden');
                        box.innerHTML = `<span class="text-brand-muted">Detectado:</span> <strong class="font-mono">"${transcript}"</strong>`;
                    }
                    if (isFinal) {
                        if (btn) btn.classList.remove('mic-recording');
                        if (lbl) lbl.textContent = "Validar mi pronunciación";
                        const clean = s => s.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(Boolean);
                        const tWords = clean(target);
                        const sWords = clean(transcript);
                        const hits = tWords.filter(w => sWords.includes(w)).length;
                        const score = Math.round((hits / Math.max(1, tWords.length)) * 100);
                        this.pronunciationResult = `
                            <div class="flex items-center justify-between">
                                <span class="font-semibold ${score >= 65 ? 'text-brand-emerald' : 'text-amber-600'}">Precisión técnica: ${score}%</span>
                                <span class="font-mono text-[11px] text-brand-muted">"${transcript}"</span>
                            </div>
                        `;
                        this.renderLesson();
                        lucide.createIcons();
                    }
                },
                (err) => {
                    if (btn) btn.classList.remove('mic-recording');
                    if (lbl) lbl.textContent = "Validar mi pronunciación";
                    this.showToast(err, 'error');
                }
            );
        }

                    </div>
                </div>
            `;
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        window.app = new DevEngApp();
    });
